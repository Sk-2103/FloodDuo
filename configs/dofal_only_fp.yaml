name: dofal_only_fp
# Single encoder: DOFA-L only (no DINOv2), LinkNet decoder.
# Ablation to measure DINOv2 branch contribution under LORO.
model:
  dofa_size: large
  dofa_indices: [5, 11, 17, 23]
  fusion_dim: 256
  use_dino: false
  use_dofa: true
  adapter: [adac, ppad]
  lora_rank: 0
  earth_adapter: true
  ea_bottleneck: 32
  ea_rho: 0.25
  grad_ckpt: true
  use_stem: false
  decoder: linknet
train:
  datasets: [floodplanet]
  crop: 512
  batch_size: 8
  epochs: 80
  lr: 5.0e-4
  weight_decay: 0.01
  num_workers: 16
loss:
  w_bce: 1.0
  w_dice: 1.0
  w_boundary: 1.0
  band_width: 3
