name: dual_dofal_fp
# DINOv2-L + DOFA-L (ViT-L/16) dual encoder.
# Matches dual_fp.yaml but uses DOFA-Large for capacity parity with Clay-L.
# Checkpoint: DOFA_ViT_large_e100.pth  (depth 24, dim 1024)
model:
  dino_name: vit_large_patch16_dinov3.lvd1689m
  dino_indices: [5, 11, 17, 23]
  dofa_size: large
  dofa_indices: [5, 11, 17, 23]
  fusion_dim: 256
  use_dino: true
  use_dofa: true
  adapter: true
train:
  datasets: [floodplanet]
  crop: 512
  batch_size: 8
  epochs: 60
  lr: 3.0e-4
  weight_decay: 0.01
  num_workers: 16
loss:
  w_bce: 1.0
  w_dice: 1.0
  w_boundary: 1.0
  band_width: 3
