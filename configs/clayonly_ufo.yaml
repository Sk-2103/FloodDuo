name: clayonly_ufo
model:
  spectral: clay
  clay_indices: [5, 11, 17, 23]
  fusion_dim: 256
  use_dino: false
  use_dofa: true
  adapter: true
  norm_mode: per_image  # standing rule: UFO = per_image, FP = dataset
train:
  datasets: [ufo]
  crop: 512
  batch_size: 8
  epochs: 60
  lr: 3.0e-4
  weight_decay: 0.01
  num_workers: 16
loss:
  w_bce: 1.0
  w_dice: 1.0
  w_boundary: 1.0
  band_width: 3
