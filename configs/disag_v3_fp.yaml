name: disag_v3_fp
# Ladder v3 = + staged cross-branch co-attention (riskiest; zero-init no-op start).
model:
  dino_name: vit_large_patch16_dinov3.lvd1689m
  dino_indices: [5, 11, 17, 23]
  spectral: clay
  clay_indices: [5, 11, 17, 23]
  fusion_dim: 256
  use_dino: true
  use_dofa: true
  adapter: [adac, ppad]
  lora_rank: 0
  earth_adapter: true
  ea_bottleneck: 32
  ea_rho: 0.25
  grad_ckpt: true
  use_stem: false
  decoder: linknet
  fusion_opts:
    aux_heads: true
    disagreement: true
    cross_attn: true
    gated_fusion: true
    aux_loss_weight: 0.3
    spectral_bias: 0.5
train:
  datasets: [floodplanet]
  crop: 512
  batch_size: 8
  epochs: 60
  lr: 5.0e-4
  weight_decay: 0.01
  num_workers: 16
loss:
  w_bce: 1.0
  w_dice: 1.0
  w_boundary: 1.0
  band_width: 3
